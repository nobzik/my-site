<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amakar.tech</title>
    
    <style>
        /* Подключаем жирный Google Sans (Pixel UI Bold) */
        @font-face {
            font-family: 'Google Sans';
            src: url('https://fonts.gstatic.com/s/googlesans/v14/4UaerENHsxJLGDuGo1OIlL3OixN0iaFF.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }

        :root {
            --md-bg: #0a0c10;
            --md-surface: rgba(26, 28, 34, 0.75);
            --md-primary: #a8c7fa;        
            --md-on-primary: #062e6f;
            --md-text: #e2e2e9;
            --md-text-variant: #c4c6d0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--md-bg);
            font-family: 'Google Sans', system-ui, -apple-system, sans-serif;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ЭКРАН ЗАГРУЗКИ (SPLASH SCREEN) --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--md-bg);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s cubic-bezier(0.2, 0, 0, 1), visibility 0.5s;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Официальный круговой индикатор загрузки M3 */
        .m3-spinner {
            width: 48px;
            height: 48px;
            animation: spinner-rotate 2s linear infinite;
        }

        .m3-spinner-circle {
            fill: none;
            stroke: var(--md-primary);
            stroke-width: 4; /* Толщина дуги по гайдам */
            stroke-linecap: round; /* Скругленные края */
            stroke-dasharray: 1, 200;
            stroke-dashoffset: 0;
            animation: spinner-dash 1.5s ease-in-out infinite;
        }

        @keyframes spinner-rotate {
            100% { transform: rotate(360deg); }
        }

        /* Фирменная анимация: кольцо "догоняет" само себя */
        @keyframes spinner-dash {
            0% { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 90, 200; stroke-dashoffset: -35px; }
            100% { stroke-dasharray: 90, 200; stroke-dashoffset: -124px; }
        }
        /* ------------------------------------- */

        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .m3-card {
            background-color: var(--md-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 40px 24px;
            max-width: 300px;
            width: 85%;
            text-align: center;
            box-shadow: 0px 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

        h1 {
            font-size: 2.6rem;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
            color: var(--md-text);
        }

        p {
            font-size: 1.2rem;
            color: var(--md-text-variant);
            margin: 0 0 32px 0;
        }

        .m3-wavy-container {
            width: 200px; 
            height: 24px;
            margin-bottom: 32px;
            overflow: hidden;
            position: relative;
        }

        .m3-wavy-svg {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 240px; 
            animation: m3-wavy-loop 1.2s linear infinite;
        }

        .wavy-path {
            stroke: var(--md-primary); 
            stroke-width: 5px;
            stroke-linecap: round;
        }

        @keyframes m3-wavy-loop {
            0% { transform: translateX(0); }
            100% { transform: translateX(-40px); }
        }

        .m3-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--md-primary);
            color: var(--md-on-primary);
            font-size: 1rem;
            padding: 0 24px;
            height: 48px;
            border-radius: 24px;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
            letter-spacing: 0.5px;
        }

        .m3-button:hover {
            background-image: linear-gradient(rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.08));
        }

        .m3-button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <svg class="m3-spinner" viewBox="25 25 50 50">
            <circle class="m3-spinner-circle" cx="50" cy="50" r="20"></circle>
        </svg>
    </div>

    <canvas id="canvas-bg"></canvas>

    <div class="m3-card">
        <h1>макар</h1>
        <p>здравствуйте</p>
        
        <div class="m3-wavy-container">
            <svg class="m3-wavy-svg" viewBox="0 0 240 24" fill="none">
                <path class="wavy-path" d="M 0 12 Q 10 2, 20 12 T 40 12 T 60 12 T 80 12 T 100 12 T 120 12 T 140 12 T 160 12 T 180 12 T 200 12 T 220 12 T 240 12" />
            </svg>
        </div>

        <a href="https://t.me/tgmakar" class="m3-button">telegram</a>
    </div>

    <script>
        // Закрытие сплеш-скрина через 2 секунды
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) splash.classList.add('hidden');
            }, 2000);
        });

        // --- ЛЕТАЮЩИЙ ТЕКСТ НА ФОНЕ ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const phrasesList = ["оооо телеграм", "оооо макар", "о да паша дуров храни телеграм"];
        const particles = [];

        class TextParticle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }
            reset() {
                this.text = phrasesList[Math.floor(Math.random() * phrasesList.length)];
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 40;
                this.speed = 0.4 + Math.random() * 0.7;
                this.fontSize = 14 + Math.random() * 14;
                this.opacity = 0.07 + Math.random() * 0.13;
                this.drift = (Math.random() - 0.5) * 0.2;
            }
            update() {
                this.y -= this.speed;
                this.x += this.drift;
                if (this.y < -30) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(168, 199, 250, ${this.opacity})`;
                ctx.font = `bold ${this.fontSize}px 'Google Sans', sans-serif`;
                ctx.fillText(this.text, this.x, this.y);
            }
        }

        for (let i = 0; i < 22; i++) particles.push(new TextParticle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        
        requestAnimationFrame(animate);
    </script>
</body>
</html>
