<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amakar.tech</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0">
    
    <style>
        /* Подключаем жирный Google Sans */
        @font-face {
            font-family: 'Google Sans';
            src: url('https://fonts.gstatic.com/s/googlesans/v14/4UaerENHsxJLGDuGo1OIlL3OixN0iaFF.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }

        :root {
            --md-bg: #0a0c10;
            --md-surface: rgba(26, 28, 34, 0.75);
            --md-secondary-container: #334458;
            --md-on-secondary-container: #d3e3fd;
            --md-primary: #a8c7fa;        
            --md-on-primary: #062e6f;
            --md-text: #e2e2e9;
            --md-text-variant: #c4c6d0;
            
            /* Фирменный голубой цвет Telegram для MD3 карточки */
            --tg-brand-color: rgba(36, 161, 222, 0.2); 
            --tg-text-color: #74c7ff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--md-bg);
            font-family: 'Google Sans', system-ui, -apple-system, sans-serif;
            font-weight: 700;
        }

        /* --- ЭКРАН ЗАГРУЗКИ --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--md-bg);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s cubic-bezier(0.2, 0, 0, 1), visibility 0.5s;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .m3-loader-container {
            width: 80px;
            height: 80px;
            background-color: var(--md-surface);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .m3-expressive-shape {
            width: 40px;
            height: 40px;
            background-color: var(--md-primary);
            will-change: border-radius, transform;
            transition: border-radius 0.6s cubic-bezier(0.2, 0, 0, 1), transform 0.6s cubic-bezier(0.2, 0, 0, 1);
        }

        /* --- BACKGROUND ANIMATION --- */
        #canvas-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- CONTENT SYSTEM --- */
        .content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            position: absolute;
            width: 85%;
            max-width: 330px;
            background-color: var(--md-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0px 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0, 0, 1);
            
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            visibility: visible;
        }

        h1 {
            font-size: 2.6rem;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
            color: var(--md-text);
        }

        h2 {
            font-size: 1.4rem;
            color: var(--md-primary);
            margin: 0 0 24px 0;
            letter-spacing: 0.5px;
        }
        
        p {
            font-size: 1.2rem;
            color: var(--md-text-variant);
            margin: 0 0 16px 0;
        }

        /* --- КОНТЕЙНЕР ПРИВЕТСТВИЙ НА РАЗНЫХ ЯЗЫКАХ --- */
        .hellos-container {
            font-size: 1.05rem;
            color: var(--md-text-variant);
            margin-bottom: 24px;
            line-height: 1.5;
            opacity: 0.85;
        }

        /* --- ТА САМАЯ ИДЕАЛЬНАЯ ВОЛНА --- */
        .m3-wavy-container {
            width: 200px; 
            height: 24px;
            overflow: hidden;
            position: relative;
        }

        .m3-wavy-svg {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 240px; 
            will-change: transform;
            animation: m3-wavy-loop 1.2s linear infinite;
        }

        .wavy-path {
            stroke: var(--md-primary); 
            stroke-width: 5px;
            stroke-linecap: round;
        }

        @keyframes m3-wavy-loop {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-40px, 0, 0); }
        }

        /* --- МАТЕРИАЛ ДИЗАЙН 3 СОЦСЕТИ (ГОЛУБАЯ КНОПКА ТГ) --- */
        .social-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .social-item {
            display: flex;
            align-items: center;
            background-color: var(--tg-brand-color); 
            padding: 16px 20px;
            border-radius: 16px; 
            text-decoration: none;
            color: var(--tg-text-color); 
            font-size: 1.1rem;
            letter-spacing: 0.15px;
            border: 1px solid rgba(36, 161, 222, 0.15);
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }

        .social-item:hover {
            background-image: linear-gradient(rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.05));
        }

        .social-item:active { 
            transform: scale(0.98);
            background-color: rgba(36, 161, 222, 0.35); 
        }

        .social-item .social-icon { 
            margin-right: 16px; 
            color: var(--tg-text-color); 
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- СТРАНИЦА ИНФО --- */
        .info-stats {
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
            width: 100%;
        }
        .stat-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }
        .stat-line:not(:last-child) { margin-bottom: 8px; }
        .stat-label { color: var(--md-text-variant); }
        .stat-value { color: var(--md-primary); }

        .credit-badge {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--md-primary);
            opacity: 0.8;
            line-height: 1.4;
        }

        /* --- НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ (M3 PILL) --- */
        .m3-floating-nav {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(26, 28, 34, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 8px;
            border-radius: 100px;
            display: flex;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
        }

        .nav-item {
            position: relative;
            width: 64px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--md-text-variant);
            transition: color 0.3s;
        }

        .nav-indicator {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--md-secondary-container);
            border-radius: 100px;
            z-index: -1;
            opacity: 0;
            transform: scaleX(0.5);
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
        }

        .nav-item.active { color: var(--md-on-secondary-container); }
        .nav-item.active .nav-indicator {
            opacity: 1;
            transform: scaleX(1);
        }

        .material-symbols-rounded { font-variation-settings: 'FILL' 0; transition: 0.2s; }
        .nav-item.active .material-symbols-rounded { font-variation-settings: 'FILL' 1; }

    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="m3-loader-container">
            <div class="m3-expressive-shape" id="morph-shape"></div>
        </div>
    </div>

    <canvas id="canvas-bg"></canvas>

    <div class="content-wrapper">
        
        <section id="home" class="page active">
            <h1>макар</h1>
            <p>здравствуйте</p>
            
            <div class="hellos-container">
                <div>hello • salut • hola</div>
                <div>ciao • нихао • konnichiwa</div>
            </div>
            
            <div class="m3-wavy-container">
                <svg class="m3-wavy-svg" viewBox="0 0 240 24" fill="none">
                    <path class="wavy-path" d="M 0 12 Q 10 2, 20 12 T 40 12 T 60 12 T 80 12 T 100 12 T 120 12 T 140 12 T 160 12 T 180 12 T 200 12 T 220 12 T 240 12" />
                </svg>
            </div>
        </section>

        <section id="socials" class="page">
            <h2>соцсети</h2>
            <div class="social-list">
                <a href="https://t.me/tgmakar" class="social-item">
                    <div class="social-icon">
                        <span class="material-symbols-rounded">send</span>
                    </div>
                    telegram
                </a>
            </div>
        </section>

        <section id="info" class="page">
            <h2>инфо</h2>
            <div class="info-stats">
                <div class="stat-line">
                    <span class="stat-label">версия</span>
                    <span class="stat-value">2.1 stable</span>
                </div>
                <div class="stat-line">
                    <span class="stat-label">визиты</span>
                    <span class="stat-value" id="visit-count">64</span>
                </div>
            </div>
            <div class="credit-badge">made by makar<br>material design 3</div>
        </section>

    </div>

    <nav class="m3-floating-nav">
        <div class="nav-item active" onclick="showPage('home')">
            <div class="nav-indicator"></div>
            <span class="material-symbols-rounded">home</span>
        </div>
        <div class="nav-item" onclick="showPage('socials')">
            <div class="nav-indicator"></div>
            <span class="material-symbols-rounded">share</span>
        </div>
        <div class="nav-item" onclick="showPage('info')">
            <div class="nav-indicator"></div>
            <span class="material-symbols-rounded">info</span>
        </div>
    </nav>

    <script>
        // --- НАВИГАЦИЯ МЕЖДУ СТРАНИЦАМИ ---
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(pageId).classList.add('active');

            const icons = { 'home': 0, 'socials': 1, 'info': 2 };
            document.querySelectorAll('.nav-item')[icons[pageId]].classList.add('active');
        }

        // --- СЧЕТЧИК УНИКАЛЬНЫХ ПОСЕТИТЕЛЕЙ ---
        function updateCounter() {
            let hasVisited = localStorage.getItem('amakar_visited_unique');
            let totalVisits = localStorage.getItem('amakar_visits_value');

            if (!totalVisits) {
                totalVisits = 64; 
            } else {
                totalVisits = parseInt(totalVisits);
                if (totalVisits > 65) {
                    totalVisits = 65;
                    localStorage.setItem('amakar_visits_value', 65);
                }
            }

            if (!hasVisited) {
                totalVisits += 1;
                localStorage.setItem('amakar_visited_unique', 'true');
                localStorage.setItem('amakar_visits_value', totalVisits);
            }

            document.getElementById('visit-count').innerText = totalVisits;
        }
        updateCounter();

        // --- ЛОГИКА РАНДОМИЗАЦИИ ФИГУР ЗАГРУЗКИ ---
        const shapeEl = document.getElementById('morph-shape');
        const m3Shapes = [
            { radius: '50%', scale: 1 },
            { radius: '10px', scale: 0.9 },
            { radius: '20px 4px 20px 4px', scale: 1.05 },
            { radius: '4px 20px 4px 20px', scale: 0.95 },
            { radius: '20px 20px 6px 6px', scale: 1 }
        ];

        let currentRotation = Math.floor(Math.random() * 360);

        function setRandomShape() {
            const nextShape = m3Shapes[Math.floor(Math.random() * m3Shapes.length)];
            currentRotation += Math.floor(Math.random() * 90) + 45; 
            if(shapeEl) {
                shapeEl.style.borderRadius = nextShape.radius;
                shapeEl.style.transform = `rotate(${currentRotation}deg) scale(${nextShape.scale})`;
            }
        }

        setRandomShape();
        const morphInterval = setInterval(setRandomShape, 600);

        window.addEventListener('load', () => {
            setTimeout(() => {
                clearInterval(morphInterval);
                const splash = document.getElementById('splash-screen');
                if (splash) splash.classList.add('hidden');
            }, 2500);
        });

        // --- ПОЛНЫЙ МИКС СТАРОГО И НОВОГО ТЕКСТА НА ФОНЕ ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Объединили все фразы вместе
        const phrasesList = [
            "оооо телеграм", 
            "оооо макар", 
            "о да паша дуров храни телеграм", 
            "люблю екстераграм", 
            "материал дизайн", 
            "ыыыыыы"
        ];
        const particles = [];

        class TextParticle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }
            reset() {
                this.text = phrasesList[Math.floor(Math.random() * phrasesList.length)];
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 40;
                this.speed = 0.4 + Math.random() * 0.7;
                this.fontSize = 14 + Math.random() * 14;
                this.opacity = 0.07 + Math.random() * 0.13;
                this.drift = (Math.random() - 0.5) * 0.2;
            }
            update() {
                this.y -= this.speed;
                this.x += this.drift;
                if (this.y < -30) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(168, 199, 250, ${this.opacity})`;
                ctx.font = `bold ${this.fontSize}px 'Google Sans', sans-serif`;
                ctx.fillText(this.text, this.x, this.y);
            }
        }

        for (let i = 0; i < 22; i++) particles.push(new TextParticle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
    </script>
</body>
</html>
