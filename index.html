<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amakar.tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Официальная темная палитра из гайдлайнов Material Design 3 */
            --md-bg: #111318;             /* Глубокий темный фон */
            --md-surface: #1a1c22;        /* Фон карточки (чуть светлее) */
            --md-primary: #a8c7fa;        /* Акцентный пастельно-синий цвет */
            --md-on-primary: #062e6f;     /* Цвет текста внутри синей кнопки */
            --md-text: #e2e2e9;           /* Главный белый текст */
            --md-text-variant: #c4c6d0;   /* Серый текст для подзаголовков */
        }

        body {
            background-color: var(--md-bg);
            color: var(--md-text);
            font-family: 'Roboto', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        /* Контейнер-карточка в стиле Material 3 */
        .m3-card {
            background-color: var(--md-surface);
            border-radius: 28px; /* Фирменное сильное скругление углов M3 */
            padding: 32px 24px;
            max-width: 320px;
            width: 100%;
            text-align: center;
            /* Мягкая Material-тень */
            box-shadow: 0px 1px 3px 1px rgba(0,0,0,0.15), 0px 1px 2px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1rem;
            color: var(--md-text-variant);
            margin: 0 0 32px 0;
            letter-spacing: 0.2px;
        }

        /* Заполненная кнопка (Filled Button) по гайдам Google */
        .m3-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--md-primary);
            color: var(--md-on-primary);
            font-weight: 500;
            font-size: 0.875rem;
            letter-spacing: 0.1px;
            padding: 0 24px;
            height: 40px;
            border-radius: 20px; /* Овальная кнопка */
            text-decoration: none;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        /* Эффект наведения (Hover) */
        .m3-button:hover {
            background-color: #bd9afc;
            background-image: linear-gradient(rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.08));
            box-shadow: 0px 1px 3px rgba(0,0,0,0.3);
        }

        /* Эффект при нажатии (Active) */
        .m3-button:active {
            background-image: linear-gradient(rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.12));
        }
    </style>
</head>
<body>

    <div class="m3-card">
        <h1>макар</h1>
        <p>здравствуйте</p>
        <a href="https://t.me/tgmakar" class="m3-button">telegram</a>
    </div>

</body>
</html>
