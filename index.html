    <style>
        /* Подключаем жирный (Bold) Google Sans, который используется в Pixel UI */
        @font-face {
            font-family: 'Google Sans';
            /* Ссылка на Bold версию (weight 700) */
            src: url('https://fonts.gstatic.com/s/googlesans/v14/4UaerENHsxJLGDuGo1OIlL3OixN0iaFF.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }

        :root {
            --md-bg: #0a0c10;
            --md-surface: rgba(26, 28, 34, 0.75);
            --md-primary: #a8c7fa;        
            --md-on-primary: #062e6f;
            --md-text: #e2e2e9;
            --md-text-variant: #c4c6d0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--md-bg);
            /* Ставим шрифт жирным по умолчанию для всего сайта */
            font-family: 'Google Sans', system-ui, -apple-system, sans-serif;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ЭКРАН ЗАГРУЗКИ С РАНДОМНЫМИ ФИГУРАМИ --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--md-bg);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s cubic-bezier(0.2, 0, 0, 1), visibility 0.6s;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .m3-morphing-shape {
            width: 80px;
            height: 80px;
            background-color: var(--md-primary);
            /* Плавный переход при смене формы и поворота через JS */
            transition: border-radius 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* ------------------------------------- */

        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .m3-card {
            background-color: var(--md-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 40px 24px;
            max-width: 300px;
            width: 85%;
            text-align: center;
            box-shadow: 0px 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

        h1 {
            font-size: 2.6rem;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
            color: var(--md-text);
        }

        p {
            font-size: 1.2rem;
            color: var(--md-text-variant);
            margin: 0 0 32px 0;
            letter-spacing: 0.2px;
        }
