<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amakar.tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --md-bg: #0a0c10;
            --md-surface: rgba(26, 28, 34, 0.75);
            --md-primary: #a8c7fa;        
            --md-track: #43474e;          
            --md-on-primary: #062e6f;
            --md-text: #e2e2e9;
            --md-text-variant: #c4c6d0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--md-bg);
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .m3-card {
            background-color: var(--md-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 40px 24px;
            max-width: 300px;
            width: 85%;
            text-align: center;
            box-shadow: 0px 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 400;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
            color: var(--md-text);
        }

        p {
            font-size: 1.1rem;
            color: var(--md-text-variant);
            margin: 0 0 24px 0;
        }

        /* --- НОВЫЙ MATERIAL YOU PROGRESS INDICATOR (M3) --- */
        .m3-progress-container {
            margin-bottom: 32px;
            position: relative;
            width: 48px;
            height: 48px;
        }

        .m3-progress-svg {
            /* Базовое вращение по кругу */
            animation: m3-rotate 1.4s linear infinite;
            width: 100%;
            height: 100%;
            transform-origin: center;
        }

        .m3-progress-track {
            stroke: var(--md-track);
            stroke-width: 4px;
        }

        .m3-progress-circle {
            stroke: var(--md-primary);
            stroke-width: 4px;
            stroke-linecap: round;
            /* Динамическое сжатие и растяжение по новым таймингам Google */
            animation: m3-dash 1.4s ease-in-out infinite;
            will-change: stroke-dasharray, stroke-dashoffset;
        }

        /* Синхронное вращение всей структуры */
        @keyframes m3-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(270deg); }
        }

        /* Анимация движения дуги: резкие переходы углов */
        @keyframes m3-dash {
            0% {
                stroke-dasharray: 1, 150;
                stroke-dashoffset: 0;
            }
            50% {
                stroke-dasharray: 90, 150;
                stroke-dashoffset: -35px;
            }
            100% {
                stroke-dasharray: 90, 150;
                stroke-dashoffset: -120px;
            }
        }
        /* -------------------------------------------------- */

        .m3-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--md-primary);
            color: var(--md-on-primary);
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0 24px;
            height: 44px;
            border-radius: 22px;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
        }

        .m3-button:hover {
            background-image: linear-gradient(rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.08));
        }

        .m3-button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="m3-card">
        <h1>макар</h1>
        <p>здравствуйте</p>
        
        <div class="m3-progress-container">
            <svg class="m3-progress-svg" viewBox="0 0 48 48">
                <circle class="m3-progress-track" cx="24" cy="24" r="18" fill="none"></circle>
                <circle class="m3-progress-circle" cx="24" cy="24" r="18" fill="none" stroke-dasharray="1, 150" stroke-dashoffset="0"></circle>
            </svg>
        </div>

        <a href="https://t.me/tgmakar" class="m3-button">telegram</a>
    </div>

    <script>
        // Код анимации летающего текста на фоне
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const phrasesList = [
            "оооо телеграм",
            "оооо макар",
            "о да паша дуров храни телеграм"
        ];

        const particles = [];
        const maxParticles = 25;

        class TextParticle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }

            reset() {
                this.text = phrasesList[Math.floor(Math.random() * phrasesList.length)];
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 40;
                this.speed = 0.4 + Math.random() * 0.8;
                this.fontSize = 12 + Math.random() * 14;
                this.opacity = 0.08 + Math.random() * 0.15;
                this.drift = (Math.random() - 0.5) * 0.2;
            }

            update() {
                this.y -= this.speed;
                this.x += this.drift;
                if (this.y < -30) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = `rgba(168, 199, 250, ${this.opacity})`;
                ctx.font = `${this.fontSize}px 'Roboto', sans-serif`;
                ctx.fillText(this.text, this.x, this.y);
            }
        }

        for (let i = 0; i < maxParticles; i++) {
            particles.push(new TextParticle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
