<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0c10">
    <meta name="description" content="Makar — личный сайт, проекты и приложение Dynamic Schedule">
    <title>amakar.tech</title>

    <!-- Google Fonts: Onest & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

    <!-- Vercel Web Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>

    <style>
        :root {
            --bg-base: #0a0c10;
            --surface-1: rgba(22, 25, 34, 0.72);
            --surface-2: rgba(30, 35, 48, 0.85);
            --surface-3: rgba(42, 49, 66, 0.9);
            --primary: #a8c7fa;
            --on-primary: #062e6f;
            --primary-container: #0842a0;
            --on-primary-container: #d3e3fd;
            --secondary-container: #1e2a3a;
            --on-secondary-container: #c2e7ff;
            --text-main: #e3e3e8;
            --text-muted: #8e9199;
            --outline: rgba(142, 145, 153, 0.18);
            --outline-hover: rgba(168, 199, 250, 0.4);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 16px;
            --radius-pill: 999px;
            --transition-m3: cubic-bezier(0.2, 0, 0, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100dvh;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Onest', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Экран загрузки с M3-морфингом */
        #preloader {
            position: fixed;
            inset: 0;
            background-color: var(--bg-base);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.5s var(--transition-m3), visibility 0.5s var(--transition-m3);
        }

        #preloader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .m3-morph-loader {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), #7cacf8);
            animation: m3Morph 2.2s infinite ease-in-out;
            box-shadow: 0 0 36px rgba(168, 199, 250, 0.25);
        }

        .loader-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            font-family: 'JetBrains Mono', monospace;
        }

        @keyframes m3Morph {
            0% { border-radius: 28% 72% 70% 30% / 30% 30% 70% 70%; transform: rotate(0deg) scale(1); }
            33% { border-radius: 50% 50% 25% 75% / 65% 35% 65% 35%; transform: rotate(120deg) scale(1.08); }
            66% { border-radius: 70% 30% 50% 50% / 35% 65% 35% 65%; transform: rotate(240deg) scale(0.95); }
            100% { border-radius: 28% 72% 70% 30% / 30% 30% 70% 70%; transform: rotate(360deg) scale(1); }
        }

        /* Фоновый Canvas с плавающими фразами */
        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Мягкое фоновое свечение */
        .ambient-glow {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(8, 66, 160, 0.22) 0%, rgba(10, 12, 16, 0) 70%);
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(40px);
        }

        /* Основной контейнер */
        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 580px;
            padding: 32px 20px 120px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        /* Верхняя шапка */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-avatar {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary-container), #1b3a6b);
            border: 1px solid var(--outline-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--on-primary-container);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            background: var(--surface-1);
            border: 1px solid var(--outline);
            backdrop-filter: blur(16px);
            font-size: 0.78rem;
            color: var(--on-secondary-container);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        /* Секции (вкладки) */
        .tab-section {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: sectionFadeIn 0.38s var(--transition-m3) forwards;
        }

        .tab-section.active {
            display: flex;
        }

        @keyframes sectionFadeIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* M3 Карточки */
        .m3-card {
            background: var(--surface-1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--outline);
            border-radius: var(--radius-xl);
            padding: 24px;
            transition: transform 0.25s var(--transition-m3), border-color 0.25s var(--transition-m3), background-color 0.25s var(--transition-m3);
        }

        .m3-card:hover {
            border-color: var(--outline-hover);
            background: var(--surface-2);
        }

        .hero-card {
            background: linear-gradient(155deg, rgba(8, 66, 160, 0.38) 0%, var(--surface-1) 65%);
            position: relative;
            overflow: hidden;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            background: rgba(168, 199, 250, 0.14);
            color: var(--primary);
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .hero-title {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.025em;
            margin-bottom: 10px;
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 22px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Кнопки Material Design 3 */
        .m3-btn {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: var(--radius-pill);
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.18s var(--transition-m3), filter 0.2s, background-color 0.2s;
            user-select: none;
        }

        .m3-btn:active {
            transform: scale(0.97);
        }

        .m3-btn-filled {
            background-color: var(--primary);
            color: var(--on-primary);
        }

        .m3-btn-filled:hover {
            filter: brightness(1.06);
        }

        .m3-btn-tonal {
            background-color: var(--secondary-container);
            color: var(--on-secondary-container);
            border: 1px solid rgba(194, 231, 255, 0.12);
        }

        .m3-btn-tonal:hover {
            background-color: var(--surface-3);
        }

        .m3-btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--outline);
        }

        .m3-btn-outline:hover {
            border-color: var(--primary);
            background-color: rgba(168, 199, 250, 0.06);
        }

        .m3-btn.recommended {
            box-shadow: 0 0 0 2px var(--primary), 0 8px 24px rgba(168, 199, 250, 0.2);
        }

        /* Карточка Приложения */
        .app-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 8px 20px rgba(29, 78, 216, 0.35);
            flex-shrink: 0;
        }

        .app-icon .material-symbols-rounded {
            font-size: 32px;
        }

        .app-title-group h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .package-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.76rem;
            color: var(--primary);
            background: rgba(168, 199, 250, 0.1);
            padding: 3px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .package-badge:hover {
            background: rgba(168, 199, 250, 0.2);
        }

        .download-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        .download-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Контакты (Личный Telegram) */
        .contact-card {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .tg-profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 16px;
            border-radius: var(--radius-lg);
            background: rgba(10, 12, 16, 0.45);
            border: 1px solid var(--outline);
        }

        .tg-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .tg-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(42, 171, 238, 0.15);
            color: #2aabee;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tg-name {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .tg-handle {
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 1px solid var(--outline);
            background: var(--surface-2);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s var(--transition-m3);
        }

        .icon-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Секция Инфо */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            padding: 18px;
            border-radius: var(--radius-lg);
            background: rgba(10, 12, 16, 0.45);
            border: 1px solid var(--outline);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary);
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .tech-tag {
            padding: 6px 12px;
            border-radius: 10px;
            background: var(--secondary-container);
            color: var(--on-secondary-container);
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Навигационная панель M3 (Bottom Navigation Bar) */
        .m3-nav-wrapper {
            position: fixed;
            bottom: max(16px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: calc(100% - 32px);
            max-width: 460px;
        }

        .m3-nav {
            background: rgba(22, 25, 34, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--outline);
            border-radius: var(--radius-pill);
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 4px;
            border-radius: var(--radius-pill);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.25s var(--transition-m3);
            position: relative;
        }

        .nav-pill {
            width: 56px;
            height: 30px;
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.25s var(--transition-m3), transform 0.25s var(--transition-m3);
        }

        .nav-item.active {
            color: var(--text-main);
        }

        .nav-item.active .nav-pill {
            background-color: var(--primary-container);
            color: var(--on-primary-container);
        }

        .nav-label {
            font-size: 0.72rem;
            font-weight: 600;
        }

        /* Эффект волны (Ripple) */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.55s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* M3 Уведомление (Snackbar) */
        #snackbar {
            position: fixed;
            bottom: 96px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text-main);
            color: var(--bg-base);
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 0.88rem;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s var(--transition-m3);
            z-index: 200;
            white-space: nowrap;
        }

        #snackbar.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .hero-title { font-size: 1.5rem; }
            .quick-actions, .download-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="preloader">
        <div class="m3-morph-loader"></div>
        <div class="loader-text">amakar.tech</div>
    </div>

    <!-- Анимированный фон с частицами фраз -->
    <canvas id="bg-canvas"></canvas>
    <div class="ambient-glow"></div>

    <!-- Основной контент -->
    <main class="app-container">
        <header class="top-bar">
            <div class="brand">
                <div class="brand-avatar">M</div>
                <div>
                    <div class="brand-title">Makar</div>
                    <div class="brand-subtitle">amakar.tech</div>
                </div>
            </div>
            <div class="status-chip">
                <span class="status-dot"></span>
                <span>Online</span>
            </div>
        </header>

        <!-- ВКЛАДКА 1: ГЛАВНАЯ -->
        <section id="tab-home" class="tab-section active">
            <div class="m3-card hero-card">
                <div class="hero-badge">
                    <span class="material-symbols-rounded" style="font-size: 16px;">auto_awesome</span>
                    Material Design 3
                </div>
                <h1 class="hero-title">Привет, я Макар</h1>
                <p class="hero-desc">
                    Разрабатываю удобные мобильные приложения, кастомные интерфейсы и экспериментирую с железом и кодом.
                </p>
                <div class="quick-actions">
                    <button class="m3-btn m3-btn-filled" onclick="switchTab('apps')">
                        <span class="material-symbols-rounded">download</span>
                        Dynamic Schedule
                    </button>
                    <button class="m3-btn m3-btn-tonal" onclick="switchTab('socials')">
